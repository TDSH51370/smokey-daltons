<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0D0B0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smokey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Smokey — The Daltons Smokehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#0D0B0A;
  --noir-2:#181310;
  --os:#F2E9D8;
  --laiton:#B79A6A;
  --neon:#E8336D;
  --braise:#D64500;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--noir);color:var(--os);font-family:"Barlow Semi Condensed",'Helvetica Neue',Arial,sans-serif;font-size:16px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- HUD ---- */
.hud{flex:none;display:flex;align-items:center;gap:12px;padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
.score{line-height:1}
.score b{font-family:"Rye",Georgia,serif;font-size:27px;color:var(--os)}
.score small{display:block;font-size:10px;letter-spacing:.28em;color:#7C6752;margin-top:3px}
.mult{font-family:"Rye",serif;font-size:19px;color:var(--neon)}
.lives{margin-left:auto;display:flex;gap:6px;align-items:center}
.lives img{width:30px;height:auto;display:block}
.lives .dead{opacity:.18;filter:grayscale(1)}
.iconbtn{font-size:17px;padding:4px 6px;opacity:.55}
.smokerlab{flex:none;font-size:10px;letter-spacing:.26em;color:#7C6752;padding:5px 14px 0;margin:0}
.smokerbar{flex:none;margin:4px 14px 0;height:9px;border:1px solid rgba(183,154,106,.4);border-radius:5px;overflow:hidden}
.smokerbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--braise),var(--laiton));transition:width .18s}

/* ---- salle ---- */
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;margin-top:8px}
.scene{position:absolute;inset:0;pointer-events:none;z-index:0}
.wall{position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 30px,rgba(242,233,216,.035) 30px 32px),
    repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 62px,rgba(242,233,216,.028) 62px 64px),
    linear-gradient(180deg,#1C1613 0%,#130E0C 62%,#0D0908 100%);
}
.fresque{position:absolute;left:50%;top:40%;width:46%;max-width:230px;transform:translateX(-50%);opacity:.08}
.pass{position:absolute;top:0;left:0;right:0;height:16px;background:linear-gradient(180deg,#241B16,#150F0C);border-bottom:2px solid var(--laiton)}
.passglow{position:absolute;top:18px;left:0;right:0;height:52px;background:linear-gradient(180deg,rgba(214,69,0,.22),transparent)}
.neon{position:absolute;left:26px;right:26px;top:34px;height:2px;background:var(--neon);box-shadow:0 0 10px rgba(232,51,109,.85)}
.lamp{position:absolute;top:16px;width:2px;height:52px;background:#3A2E26}
.lamp::before{content:"";position:absolute;left:-11px;top:48px;width:24px;height:15px;border-radius:2px 2px 12px 12px;background:var(--laiton)}
.lamp::after{content:"";position:absolute;left:-80px;top:60px;width:164px;height:190px;background:radial-gradient(ellipse at 50% 0,rgba(255,170,80,.20),transparent 70%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:86px;
  background:repeating-conic-gradient(#3D2519 0% 25%,#2A1810 0% 50%) 0 0/46px 46px;
  border-top:3px solid #8A6236;box-shadow:inset 0 14px 26px rgba(214,69,0,.18)}
.logs{position:absolute;left:6px;bottom:64px;width:78px;opacity:.92}
.smoker{position:absolute;right:6px;bottom:62px;width:104px;opacity:.95}
.booths{position:absolute;left:0;right:0;bottom:74px;width:100%}
.shelf{position:absolute;left:4%;top:46%;width:88px;opacity:.85}
.bunting{position:absolute;top:14px;left:0;width:100%;transform-origin:50% 0;animation:sway 6.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
.cactus{position:absolute;left:6%;top:23%;width:52px;color:#E8336D;
  filter:drop-shadow(0 0 5px #E8336D) drop-shadow(0 0 14px rgba(232,51,109,.55));animation:flick 5s infinite}
.bbqsign{position:absolute;right:6%;top:23%;width:92px;text-align:center;animation:flick 6.4s .9s infinite}
.bbqsign span{font-family:"Rye",serif;font-size:22px;color:#FF7A2F;
  text-shadow:0 0 7px rgba(255,122,47,.95),0 0 20px rgba(255,122,47,.45)}
.bbqsign svg{display:block;width:70px;margin:2px auto 0;color:#FF7A2F;
  filter:drop-shadow(0 0 5px rgba(255,122,47,.9))}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.3}97%{opacity:.95}98%{opacity:.45}99%{opacity:1}}
.puffs{position:absolute;right:24px;bottom:126px;width:34px;height:120px}
.puffs i{position:absolute;bottom:0;left:9px;width:16px;height:16px;border-radius:50%;
  background:rgba(242,233,216,.15);animation:puff 3.6s linear infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}18%{opacity:.85}100%{transform:translate(-20px,-112px) scale(2.3);opacity:0}}
.flame{animation:flamefx 1.7s ease-in-out infinite}
@keyframes flamefx{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){
  .bunting,.cactus,.bbqsign,.puffs i,.flame{animation:none}
}
.tmr{font-family:"Rye",serif;font-size:44px;line-height:1;margin:0 0 10px;color:var(--os)}
.tmr.hot{color:var(--neon)}
.tmrbar{height:6px;border-radius:3px;background:rgba(183,154,106,.22);overflow:hidden;margin:0 0 14px}
.road{position:absolute;inset:0;overflow:hidden;z-index:1;display:none}
.road.on{display:block}
.road .sky{position:absolute;inset:0;background:linear-gradient(180deg,#191125 0%,#2C1A1C 52%,#3A2318 100%)}
.road .moon{position:absolute;right:16%;top:12%;width:44px;height:44px;border-radius:50%;
  background:#E8DCC6;box-shadow:0 0 26px rgba(232,220,198,.35)}
.road .bgc{position:absolute;bottom:70px;width:44px;opacity:.85}
.road .bgc svg{display:block;width:100%}
.road .ground{position:absolute;left:0;right:0;bottom:0;height:76px;background:#2C1B12;border-top:3px solid #6B4A2E}
.road .mark{position:absolute;left:0;right:0;top:30px;height:5px;
  background:repeating-linear-gradient(90deg,#8A6236 0 30px,transparent 30px 60px);opacity:.5}
.road .runner{position:absolute;bottom:90px;width:104px;margin-left:-52px;will-change:transform}
.road .runner img{display:block;width:100%}
.road .runner .face{position:absolute;left:0;top:0;width:100%}
.road .runner .tongue{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.25)}
.road .runner.down{transform:translateY(6px) rotate(-70deg)!important;transition:transform .35s ease-in}
.road .shadow{position:absolute;left:50%;bottom:-16px;width:70px;height:12px;margin-left:-35px;
  border-radius:50%;background:#000;opacity:.5}
.road .legs{position:absolute;bottom:-15px;left:50%;width:44px;height:18px;margin-left:-22px}
.road .legs i{position:absolute;bottom:0;width:10px;height:18px;border-radius:5px;background:#2A1D16;
  animation:stepfx .2s linear infinite alternate}
.road .legs i:first-child{left:2px}
.road .legs i:last-child{right:2px;animation-delay:-.1s}
.road .legs.hidden{opacity:0}
@keyframes stepfx{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-7px) scaleY(.78)}}
.road .obs{position:absolute;bottom:76px;left:0;width:42px;will-change:transform}
.road .obs.puddle{bottom:66px;width:92px}
.road .obs svg{display:block;width:100%}
.road .facade{position:absolute;right:-70%;bottom:70px;width:180px;transition:right 1.2s ease-out}
.road .facade.in{right:6%}
.road .facade svg{display:block;width:100%}
@media (prefers-reduced-motion:reduce){ .road .legs i{animation:none} }
.maze{position:relative;margin:0 auto 16px}
.maze svg{display:block;width:100%}
.maze{touch-action:none}
.maze .token{position:absolute;border-radius:50%;display:block;pointer-events:none}
.maze .token.idle{animation:grabpulse 1.5s ease-out infinite}
.maze .token.held{filter:drop-shadow(0 0 8px rgba(232,51,109,.8))}
@keyframes grabpulse{0%{box-shadow:0 0 0 0 rgba(232,51,109,.65)}100%{box-shadow:0 0 0 16px rgba(232,51,109,0)}}
.maze .token img{display:block;width:100%}
.coals{margin:0 0 14px}
.blower{width:150px;margin:0 auto -6px;position:relative;transition:transform .08s ease-out}
.blower img{display:block;width:100%}
.blower .face{position:absolute;left:0;top:0;width:100%}
.blower .tongue{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.22);transition:transform .1s}
.blower.puff{transform:scale(1.07)}
.blower.puff .tongue{transform:scaleY(1.2)}
.breath{position:absolute;left:50%;top:62px;width:0;height:0;pointer-events:none;display:block}
.mist{position:absolute;left:0;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,233,216,.6),rgba(242,233,216,.18) 60%,transparent 75%);
  animation:mistfx .68s ease-out forwards}
@keyframes mistfx{
  0%{transform:translate(0,0) scale(.3);opacity:.9}
  100%{transform:translate(var(--dx,0px),56px) scale(2.7);opacity:0}
}
@media (prefers-reduced-motion:reduce){ .mist{display:none} .maze .token.idle{animation:none} }
.coals svg{display:block;width:100%;max-width:300px;margin:0 auto}
.heatbar{height:14px;border:2px solid var(--laiton);border-radius:8px;overflow:hidden;margin:0 0 12px;background:var(--noir-2)}
.heatbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8A3A10,var(--braise),#FFB35C)}
.tmrbar i{display:block;height:100%;width:100%;background:var(--braise)}
.stage>*:not(.scene){z-index:2;position:absolute}

.item{width:52px;height:52px;left:0;top:0;will-change:transform;z-index:3}
.item.gold{filter:drop-shadow(0 0 8px rgba(183,154,106,.9))}
#tex{left:0;bottom:8px;width:190px;will-change:transform}
#tex .mark{display:block;width:100%}
#tex .face{position:absolute;left:0;top:0;width:100%}
#tex .tray{position:absolute;left:0;top:104px;width:100%}
.pad{flex:none;position:relative;height:80px;touch-action:none;
  background:linear-gradient(180deg,#1D1512,#0E0A09);
  border-top:2px solid rgba(183,154,106,.45);
  margin-bottom:env(safe-area-inset-bottom)}
.padrail{position:absolute;left:32px;right:32px;top:37px;height:10px;border-radius:5px;
  background:repeating-linear-gradient(90deg,#31221A 0 11px,#241811 11px 22px);
  box-shadow:inset 0 1px 0 rgba(183,154,106,.28),inset 0 -1px 0 rgba(0,0,0,.5)}
.grip{position:absolute;top:12px;left:0;width:60px;height:60px;margin-left:-30px;border-radius:50%;
  background:linear-gradient(180deg,#33251B,#17110E);border:2px solid var(--laiton);
  box-shadow:0 3px 10px rgba(0,0,0,.6),0 0 14px rgba(214,69,0,.18);
  display:flex;align-items:center;justify-content:center}
.grip img{width:42px;display:block;opacity:.95}
.grip.hold{border-color:var(--braise);box-shadow:0 3px 10px rgba(0,0,0,.6),0 0 18px rgba(214,69,0,.5)}
.pop{font-family:"Rye",serif;font-size:20px;color:var(--os);pointer-events:none;animation:pop .8s forwards;z-index:4}
.padhint{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:11px;
  letter-spacing:.2em;color:#6E5A48;transition:opacity .3s}
.pop.bad{color:var(--neon)}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-46px)}}
.shake{animation:shk .32s}
@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ---- écrans ---- */
.ov{position:absolute;inset:0;background:rgba(8,6,5,.95);display:none;align-items:center;justify-content:center;padding:24px;z-index:9;overflow-y:auto}
.ov.on{display:flex}
.panel{width:100%;max-width:430px;text-align:center}
.panel .logo{width:min(240px,68%);margin:0 auto;display:block}
.brandline{font-family:"Rye",serif;font-size:15px;color:var(--laiton);letter-spacing:.02em;margin:0}
.brandsub{font-size:10px;letter-spacing:.42em;color:#8A705A;margin:3px 0 0}
h1{font-family:"Rye",serif;font-size:clamp(32px,10.5vw,50px);line-height:1;margin:22px 0 10px;text-shadow:3px 3px 0 var(--neon),6px 6px 0 rgba(0,0,0,.6)}
h2{font-family:"Rye",serif;font-size:clamp(26px,8vw,38px);margin:0 0 10px;text-shadow:2px 2px 0 var(--neon)}
.lead{color:#C0AA92;font-size:18px;line-height:1.45;margin:0 auto 22px;max-width:32ch}
.legend{display:flex;justify-content:center;gap:18px;margin:0 0 24px;flex-wrap:wrap}
.legend div{font-size:13px;color:#9C8570;line-height:1.3}
.legend svg{display:block;width:40px;height:40px;margin:0 auto 4px}
.btn{display:inline-block;padding:15px 38px;border-radius:3px;background:var(--braise);color:#1A0C05;font-weight:700;font-size:21px;letter-spacing:.05em;box-shadow:0 4px 0 #7A2700;transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7A2700}
.btn.alt{background:none;color:var(--laiton);border:2px solid rgba(183,154,106,.55);box-shadow:none;font-size:17px;padding:12px 26px}
.best{margin-top:20px;font-size:16px;color:#8A705A}
.best b{color:var(--laiton)}
.rules{list-style:none;margin:0 auto 22px;padding:0;max-width:330px;text-align:left}
.rules li{position:relative;padding:0 0 10px 28px;font-size:16.5px;line-height:1.35;color:#C0AA92}
.rules li b{position:absolute;left:0;top:1px;font-family:"Rye",serif;font-size:13px;color:var(--laiton)}
.boardtitle{font-size:11px;letter-spacing:.28em;color:#7C6752;margin:24px 0 8px}
.board{list-style:none;margin:0 auto 4px;padding:0;max-width:290px;text-align:left}
.board li{display:flex;align-items:baseline;gap:10px;padding:6px 2px;border-bottom:1px solid rgba(183,154,106,.16);color:#C0AA92;font-size:17px}
.board li b{font-family:"Rye",serif;font-size:14px;color:var(--laiton);width:18px}
.board li i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li span{margin-left:auto;color:var(--os);font-weight:600}
.board li.me i,.board li.me span{color:var(--neon)}
.boardnote{font-size:12px;color:#6E5A48;margin:8px 0 0}
.nameinput{display:block;width:100%;max-width:250px;margin:0 auto 10px;padding:12px;background:#1A1310;border:2px solid rgba(183,154,106,.5);border-radius:3px;color:var(--os);font-family:inherit;font-size:19px;text-align:center}
.nameinput:focus{outline:2px solid var(--laiton);outline-offset:2px}
.err{color:var(--neon);font-size:14px;margin:0 0 10px}
#tex .tongue{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.3);transition:transform .12s ease-out}
#tex .face.lick .tongue{transform:scaleY(2)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats{display:flex;justify-content:center;gap:28px;margin:6px 0 24px;flex-wrap:wrap}
.stat b{display:block;font-family:"Rye",serif;font-size:26px}
.stat span{font-size:10px;letter-spacing:.2em;color:#7C6752}
.gauge{position:relative;height:58px;border:2px solid var(--laiton);border-radius:3px;background:var(--noir-2);overflow:hidden;margin:0 0 8px}
.gauge .z{position:absolute;top:0;bottom:0}
.gauge .z1{background:rgba(214,69,0,.35)}
.gauge .z2{background:rgba(183,154,106,.85)}
.gauge .cur{position:absolute;top:-3px;bottom:-3px;width:5px;background:var(--os)}
.gtip{font-size:13px;letter-spacing:.16em;color:#7C6752;margin:0 0 20px}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="score"><b id="score">0</b><small>POINTS</small></div>
    <div class="mult" id="mult"></div>
    <div class="lives" id="lives"></div>
    <button class="iconbtn" id="sound">🔊</button>
    <button class="iconbtn" id="pause">⏸</button>
  </div>
  <p class="smokerlab">FUMOIR</p>
  <div class="smokerbar"><i id="smoker"></i></div>
  <div class="stage" id="stage"><div id="tex"></div></div>
  <div class="pad" id="pad">
    <div class="padrail"></div>
    <div class="grip" id="grip"></div>
    <span class="padhint" id="padhint">GLISSEZ POUR DÉPLACER SMOKEY</span>
  </div>
  <div class="ov on" id="ov"><div class="panel" id="panel"></div></div>
</div>

<script>

var actx=null;
function beep(f,d,type,v){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(v||.05,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }catch(e){}
}

function b64ab(d){
  var bin=atob(d.split(",")[1]), n=bin.length, u=new Uint8Array(n);
  for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  return u.buffer;
}
function initAudio(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    Object.keys(SND).forEach(function(k){
      if(SBUF[k]) return;
      try{
        var p=actx.decodeAudioData(b64ab(SND[k]));
        if(p&&p.then) p.then(function(b){ SBUF[k]=b; }).catch(function(){});
      }catch(e){}
    });
  }catch(e){}
}
function playSnd(key,vol,rate){
  if(!soundOn||!actx||!SBUF[key]) return false;
  try{
    var s=actx.createBufferSource(), g=actx.createGain();
    s.buffer=SBUF[key];
    if(rate) s.playbackRate.value=rate;
    g.gain.value=vol||.85;
    s.connect(g); g.connect(actx.destination); s.start();
    return true;
  }catch(e){ return false; }
}
function voice(kind){
  if(!soundOn) return;
  if(playSnd(kind==="moo"?"moo":"yee",.85)) return;
  synthVoice(kind);
}
function synthVoice(kind){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    var t=actx.currentTime;
    var o=actx.createOscillator(), f=actx.createBiquadFilter(), g=actx.createGain();
    var lfo=actx.createOscillator(), lg=actx.createGain();
    o.type="sawtooth"; f.type="lowpass";
    o.connect(f); f.connect(g); g.connect(actx.destination);
    lfo.connect(lg); lg.connect(o.frequency);
    var dur;
    if(kind==="moo"){
      dur=1.0;
      o.frequency.setValueAtTime(168,t);
      o.frequency.linearRampToValueAtTime(142,t+.14);
      o.frequency.setValueAtTime(142,t+.55);
      o.frequency.linearRampToValueAtTime(96,t+dur);
      f.frequency.setValueAtTime(760,t);
      f.frequency.linearRampToValueAtTime(340,t+dur);
      f.Q.value=6;
      lfo.frequency.value=5.5; lg.gain.value=7;
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(.10,t+.09);
      g.gain.setValueAtTime(.10,t+.62);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    } else {
      dur=.62;
      o.frequency.setValueAtTime(380,t);
      o.frequency.exponentialRampToValueAtTime(980,t+.11);
      o.frequency.setValueAtTime(980,t+.19);
      o.frequency.exponentialRampToValueAtTime(620,t+.38);
      o.frequency.exponentialRampToValueAtTime(430,t+dur);
      f.frequency.setValueAtTime(2600,t);
      f.frequency.linearRampToValueAtTime(1200,t+dur);
      f.Q.value=3;
      lfo.frequency.value=9; lg.gain.value=22;
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(.085,t+.05);
      g.gain.setValueAtTime(.085,t+.3);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    }
    o.start(t); lfo.start(t); o.stop(t+dur+.02); lfo.stop(t+dur+.02);
  }catch(e){}
}

var scores=[], lastName="", screenName="home", online=true, TOPN=10;
function localLoad(){
  try{
    var raw=window.localStorage.getItem("smokey_leaderboard");
    if(raw){ var v=JSON.parse(raw); if(v&&v.length) scores=v; }
  }catch(e){}
}
function localSave(){
  try{ window.localStorage.setItem("smokey_leaderboard",JSON.stringify(scores)); }catch(e){}
}
function refreshBoard(){ if(screenName==="home") home(); }
function loadScores(){
  var done=false;
  try{
    fetch("api/scores",{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function(d){
      done=true;
      if(d&&d.scores){ online=true; scores=d.scores; refreshBoard(); }
    }).catch(function(){
      done=true; online=false; localLoad(); refreshBoard();
    });
  }catch(e){ online=false; localLoad(); refreshBoard(); }
  if(!done && !scores.length) localLoad();
}
function qualifies(v){ return v>0 && (scores.length<TOPN || v>scores[scores.length-1].s); }
function addScore(n,v){
  var name=n.slice(0,14);
  var mine=null,i;
  for(i=0;i<scores.length;i++) if(scores[i].n===name) mine=scores[i];
  if(mine){ if(v>mine.s) mine.s=v; } else scores.push({n:name,s:v});
  scores.sort(function(a,b){ return b.s-a.s; });
  scores=scores.slice(0,TOPN);
  if(!online){ localSave(); return; }
  try{
    fetch("api/scores",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:name,score:v})
    }).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function(d){
      if(d&&d.scores){ scores=d.scores; refreshBoard(); }
    }).catch(function(){ online=false; localSave(); });
  }catch(e){ online=false; localSave(); }
}
function esc(t){ return String(t).replace(/[<>&"]/g,function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]; }); }
function boardHTML(){
  if(!scores.length) return '<p class="boardtitle">TABLEAU DES SCORES</p>'+
    '<p class="boardnote">Personne n\'a encore tenu le service. À vous d\'ouvrir le classement.</p>';
  var li="";
  for(var i=0;i<scores.length;i++){
    li+='<li'+(scores[i].n===lastName&&scores[i].s===S.score?' class="me"':'')+'>'+
        '<b>'+(i+1)+'</b><i>'+esc(scores[i].n)+'</i><span>'+scores[i].s+'</span></li>';
  }
  return '<p class="boardtitle">TABLEAU DES SCORES</p><ol class="board">'+li+'</ol>'+
         '<p class="boardnote">'+(online?"Classement commun à tous les joueurs.":"Classement de cet appareil, serveur injoignable.")+'</p>';
}

function pickGood(){
  var tot=0,i; for(i=0;i<GOODS.length;i++) tot+=GOODS[i].w;
  var r=Math.random()*tot;
  for(i=0;i<GOODS.length;i++){ r-=GOODS[i].w; if(r<=0) return GOODS[i]; }

function loop(ts){
  raf=requestAnimationFrame(loop);
  if(paused){ lastT=ts; return; }
  var dt=Math.min((ts-lastT)/1000,.08); lastT=ts;
  var w=stage.clientWidth, h=stage.clientHeight;

  S.texX+=(S.aimX-S.texX)*Math.min(dt*14,1);
  S.texX=Math.max(TEX_W/2,Math.min(w-TEX_W/2,S.texX));
  texEl.style.transform="translateX("+(S.texX-TEX_W/2)+"px)";
  if(padW>60){
    var pr=(S.texX-TEX_W/2)/Math.max(w-TEX_W,1);
    grip.style.left=(30+pr*(padW-60)).toFixed(1)+"px";
  }

  S.spawnIn-=dt;
  if(S.spawnIn<=0){ spawn(); S.spawnIn=Math.max(.42,1.15-S.level*.075)*(.7+Math.random()*.6); }

  var trayY=h-8-42;
  var near=null, nd=1e9, eyeY=h-101;
  for(var i=S.items.length-1;i>=0;i--){
    var it=S.items[i];
    it.y+=it.v*dt;
    it.el.style.transform="translate("+(it.x-26)+"px,"+it.y+"px)";
    var ddx=it.x-S.texX, ddy=(it.y+26)-eyeY, d2=ddx*ddx+ddy*ddy;
    if(d2<nd){ nd=d2; near=it; }
    if(it.y>trayY-30 && it.y<trayY+36 && Math.abs(it.x-S.texX)<CATCH){ catchIt(it,i); continue; }
    if(it.y>h+60){ it.el.remove(); S.items.splice(i,1); }
  }
  eyeT+=dt;
  if(spin>0){
    spin-=dt;
    var a=(0.55-Math.max(spin,0))/0.55*Math.PI*4;
    pupL.setAttribute("transform","translate("+(Math.cos(a)*5.5).toFixed(2)+","+(Math.sin(a)*5.5).toFixed(2)+")");
    pupR.setAttribute("transform","translate("+(Math.cos(a+.7)*5).toFixed(2)+","+(Math.sin(a+.7)*5).toFixed(2)+")");
  } else {
    var gx=0, gy=0;
    if(near){
      var vx=near.x-S.texX, vy=(near.y+26)-eyeY, len=Math.sqrt(vx*vx+vy*vy)||1;
      gx=vx/len*5; gy=Math.max(-3,Math.min(5,vy/len*5));
    }
    pupL.setAttribute("transform","translate("+(gx+Math.sin(eyeT*3.1)*1.3).toFixed(2)+","+(gy+Math.cos(eyeT*2.2)).toFixed(2)+")");
    pupR.setAttribute("transform","translate("+(gx*.7+Math.cos(eyeT*2.6)*1.8).toFixed(2)+","+(gy*.8+Math.sin(eyeT*3.4)*1.2).toFixed(2)+")");
  }
}

}

/* ---------- le labyrinthe ---------- */
function genMaze(n){
  var c=[],x,y;
  for(y=0;y<n;y++){ c.push([]); for(x=0;x<n;x++) c[y].push({n:1,e:1,s:1,w:1,v:0}); }
  var stack=[[0,0]]; c[0][0].v=1;
  var DIRS=[[0,-1,"n","s"],[1,0,"e","w"],[0,1,"s","n"],[-1,0,"w","e"]];
  while(stack.length){
    var cur=stack[stack.length-1], cx=cur[0], cy=cur[1], opts=[];
    for(var i=0;i<4;i++){
      var nx=cx+DIRS[i][0], ny=cy+DIRS[i][1];
      if(nx>=0&&ny>=0&&nx<n&&ny<n&&!c[ny][nx].v) opts.push(DIRS[i]);
    }
    if(!opts.length){ stack.pop(); continue; }
    var d=opts[Math.floor(Math.random()*opts.length)];
    c[cy][cx][d[2]]=0;
    c[cy+d[1]][cx+d[0]][d[3]]=0;
    c[cy+d[1]][cx+d[0]].v=1;
    stack.push([cx+d[0],cy+d[1]]);
  }
  c[n-1][n-1].e=0;
  return c;
}

function laby(){
  if(S.lives<=0) return;
  paused=true; screenName="maze";
  var n=Math.min(9,5+S.level);
  var grid=genMaze(n);
  var cell=Math.max(26,Math.min(42,Math.floor(300/n)));
  var size=n*cell, pad=4, tok=Math.round(cell*.62);

  var w='<svg viewBox="'+(-pad)+' '+(-pad)+' '+(size+pad*2)+' '+(size+pad*2)+'" xmlns="http://www.w3.org/2000/svg">'+
        '<rect x="'+(-pad)+'" y="'+(-pad)+'" width="'+(size+pad*2)+'" height="'+(size+pad*2)+'" fill="#140F0D"/>'+
        '<rect x="'+(size-cell)+'" y="'+(size-cell)+'" width="'+cell+'" height="'+cell+'" fill="rgba(214,69,0,.28)"/>'+
        '<g stroke="#B79A6A" stroke-width="3" stroke-linecap="round">';
  for(var y=0;y<n;y++) for(var x=0;x<n;x++){
    var g=grid[y][x], px=x*cell, py=y*cell;
    if(g.n) w+='<path d="M'+px+' '+py+' h'+cell+'"/>';
    if(g.w) w+='<path d="M'+px+' '+py+' v'+cell+'"/>';
    if(g.s) w+='<path d="M'+px+' '+(py+cell)+' h'+cell+'"/>';
    if(g.e) w+='<path d="M'+(px+cell)+' '+py+' v'+cell+'"/>';
  }
  w+='</g><path d="M'+(size+2)+' '+(size-cell*.5)+' l-9 -7 v14 Z" fill="#D64500"/></svg>';

  panel.innerHTML='<h2>Sortez du labyrinthe</h2>'+
    '<p class="lead">Posez le doigt sur la tête de Smokey et tirez-le jusqu\'à la sortie, en bas à droite. Vingt secondes.</p>'+
    '<p class="tmr" id="mtmr">20</p><div class="tmrbar"><i id="mtb"></i></div>'+
    '<div class="maze" id="mz" style="width:'+(size+pad*2)+'px">'+w+
    '<span class="token" id="tok" style="width:'+tok+'px;height:'+tok+'px"><img src="'+LOGO+'" alt=""></span></div>'+
    '<p class="gtip">POSEZ LE DOIGT SUR SMOKEY</p>';
  ov.classList.add("on");

  var tokEl=document.getElementById("tok"), mz=document.getElementById("mz"),
      mtmr=document.getElementById("mtmr"), mtb=document.getElementById("mtb");
  var r=tok/2*0.82;
  var px=cell/2, py=cell/2, tx=px, ty=py, held=false,
      run=true, left=20, t0=performance.now(), cheer=0, speed=cell*6.5, lastCell="";

  function place(){
    tokEl.style.left=(pad+px-tok/2)+"px";
    tokEl.style.top=(pad+py-tok/2)+"px";
  }
  place();
  tokEl.classList.add("idle");

  function limX(dir){
    var i=Math.floor(px/cell), j=Math.floor(py/cell);
    if(i<0||j<0||i>=n||j>=n) return dir>0?px:px;
    if(dir>0) return grid[j][i].e===0 ? 1e9 : (i+1)*cell-r;
    return grid[j][i].w===0 ? -1e9 : i*cell+r;
  }
  function limY(dir){
    var i=Math.floor(px/cell), j=Math.floor(py/cell);
    if(i<0||j<0||i>=n||j>=n) return py;
    if(dir>0) return grid[j][i].s===0 ? 1e9 : (j+1)*cell-r;
    return grid[j][i].n===0 ? -1e9 : j*cell+r;
  }

  function stepMove(dt){
    if(!held) return;
    var dx=tx-px, dy=ty-py;
    var step=speed*dt;
    var horiz=Math.abs(dx)>Math.abs(dy);

    function tryX(){
      if(Math.abs(dx)<1) return false;
      var d=dx>0?1:-1, lim=limX(d);
      var want=px+d*Math.min(step,Math.abs(dx));
      var np=d>0?Math.min(want,lim):Math.max(want,lim);
      if(Math.abs(np-px)<.4) return false;
      px=np;
      var jc=Math.floor(py/cell)*cell+cell/2;
      py+=Math.max(-step,Math.min(step,jc-py));
      return true;
    }
    function tryY(){
      if(Math.abs(dy)<1) return false;
      var d=dy>0?1:-1, lim=limY(d);
      var want=py+d*Math.min(step,Math.abs(dy));
      var np=d>0?Math.min(want,lim):Math.max(want,lim);
      if(Math.abs(np-py)<.4) return false;
      py=np;
      var ic=Math.floor(px/cell)*cell+cell/2;
      px+=Math.max(-step,Math.min(step,ic-px));
      return true;
    }

    var moved = horiz ? (tryX()||tryY()) : (tryY()||tryX());
    if(!moved) return;
    py=Math.max(r,Math.min(size-r,py));
    if(px>size+tok){ px=size+tok; place(); win(); return; }
    px=Math.max(r,Math.min(size+tok,px));
    place();
    var key=Math.floor(px/cell)+":"+Math.floor(py/cell);
    if(key!==lastCell){ lastCell=key; beep(560,.025,"square",.02); }
  }

  function loopM(ts){
    if(!run) return;
    requestAnimationFrame(loopM);
    var dt=Math.min((ts-t0)/1000,.05); t0=ts;
    left-=dt; if(left<0) left=0;
    mtmr.textContent=Math.ceil(left);
    mtmr.className="tmr"+(left<4?" hot":"");
    mtb.style.width=(left/20*100)+"%";
    cheer-=dt;
    if(cheer<=0){ cheer=4.6; playSnd("go",.8); }
    stepMove(dt);
    if(left<=0) lose();
  }
  requestAnimationFrame(loopM);

  var grabX=0, grabY=0;
  function mzPoint(e){
    var b=mz.getBoundingClientRect();
    var sc=(size+pad*2)/Math.max(b.width,1);
    return {
      x:((e.clientX!==undefined?e.clientX:e.touches[0].clientX)-b.left)*sc-pad,
      y:((e.clientY!==undefined?e.clientY:e.touches[0].clientY)-b.top)*sc-pad
    };
  }
  mz.addEventListener("pointerdown",function(e){
    var q=mzPoint(e);
    if(Math.abs(q.x-px)>tok || Math.abs(q.y-py)>tok) return;
    held=true;
    grabX=px-q.x; grabY=py-q.y;
    tx=px; ty=py;
    tokEl.classList.remove("idle");
    tokEl.classList.add("held");
    if(mz.setPointerCapture) try{ mz.setPointerCapture(e.pointerId); }catch(err){}
  });
  mz.addEventListener("pointermove",function(e){
    if(!held) return;
    var q=mzPoint(e);
    tx=q.x+grabX; ty=q.y+grabY;
  });
  function relMz(){
    held=false;
    tokEl.classList.remove("held");
    if(run) tokEl.classList.add("idle");
  }
  mz.addEventListener("pointerup",relMz);
  mz.addEventListener("pointercancel",relMz);

  function win(){
    if(!run) return;
    run=false;
    tokEl.classList.remove("idle","held");
    var bonus=Math.round((80+24*left)*S.level);
    S.score+=bonus; S.escapes++; hud();
    voice("yeehaw");
    over("Sorti !","+"+bonus+" points, en "+(20-left).toFixed(1)+" secondes.");
  }
  function lose(){
    if(!run) return;
    run=false;
    tokEl.classList.remove("idle","held");
    voice("moo");
    over("Perdu dans le labyrinthe","Smokey tourne encore en rond. Aucun point.");
  }
  function over(title,txt){
    panel.innerHTML='<h2>'+title+'</h2><p class="lead">'+txt+'</p>'+
      '<button class="btn" id="mgo">Reprendre la route</button>';
    document.getElementById("mgo").onclick=course;
  }
}

        cacti=Array.prototype.slice.call(road.querySelectorAll(".bgc")),
        rpL=runner.querySelector(".pupL"), rpR=runner.querySelector(".pupR");

    var W=stage.clientWidth, runX=Math.max(64,W*0.2);
    runner.style.left=runX+"px";

    var TARGET=12, cleared=0, speed=195, spawnAt=W+120, obs=[],
        y=0, vy=0, air=false, fallen=false, done=false, over=0,
        markX=0, t0=performance.now(), raf2=null;

    function addObs(){
      var puddle=Math.random()<.42;
      var d=document.createElement("div");
      d.className="obs"+(puddle?" puddle":"");
      d.innerHTML=puddle?PUDDLE:BARRIER;
      road.appendChild(d);
      obs.push({el:d,x:spawnAt,w:puddle?92:42,puddle:puddle,passed:false});
    }
    addObs();

    function jump(){
      if(air||done) return;
      vy=-560; air=true; legs.classList.add("hidden");
      if(!playSnd("hop",.9,.95+Math.random()*.14)) beep(760,.06,"square",.04);
    }

    function land(){
      air=false; y=0; vy=0; legs.classList.remove("hidden");
    }

    function fall(){
      if(done) return;
      fallen=true; done=true;
      runner.classList.add("down");
      legs.classList.add("hidden");
      voice("moo");
      setTimeout(finish,900);
    }

    function arrive(){
      if(done) return;
      done=true;
      voice("yeehaw");
      facade.classList.add("in");
      setTimeout(finish,1400);
    }

    function step(ts){
      if(done && !fallen && !facade.classList.contains("in")) return;
      raf2=requestAnimationFrame(step);
      var dt=Math.min((ts-t0)/1000,.05); t0=ts;
      if(done) return;

      speed=Math.min(470,185+(S.level-1)*22+cleared*17);
      markX=(markX-speed*dt)%60;
      mark.style.backgroundPositionX=markX+"px";

      cacti.forEach(function(c,i){
        var cx=parseFloat(c.dataset.x||(c.style.left));
        if(isNaN(cx)) cx=W*(i?1.1:.6);
        cx-=speed*.32*dt;
        if(cx<-90) cx=W+80+Math.random()*W*.6;
        c.dataset.x=cx;
        c.style.left=cx+"px";
      });

      if(air){
        vy+=1580*dt; y-=vy*dt;
        if(y<=0) land();
      }
      runner.style.transform="translateY("+(-y)+"px) rotate("+(air?-8:0)+"deg)";
      shadow.style.transform="scale("+(1-Math.min(y/140,.6))+")";
      shadow.style.opacity=(0.5-Math.min(y/300,.35)).toFixed(2);

      var ea=Math.min(1,speed/430);
      var rot=ts/1000*(3+ea*7);
      rpL.setAttribute("transform","translate("+(Math.cos(rot)*4).toFixed(1)+","+(Math.sin(rot)*4).toFixed(1)+")");
      rpR.setAttribute("transform","translate("+(Math.cos(rot+.8)*3.6).toFixed(1)+","+(Math.sin(rot+.8)*3.6).toFixed(1)+")");

      for(var i=obs.length-1;i>=0;i--){
        var o=obs[i];
        o.x-=speed*dt;
        o.el.style.transform="translateX("+o.x+"px)";
        var hitX=(o.x < runX+26) && (o.x+o.w > runX-26);
        if(hitX && (o.puddle ? y<22 : y<48)){ fall(); return; }
        if(!o.passed && o.x+o.w < runX-26){
          o.passed=true; cleared++;
          var gp=20*S.level;
          S.score+=gp; hud();
          pop("+"+gp,runX+40,stage.clientHeight*.4);
          beep(880,.05,"square",.03);
          if(cleared>=TARGET){ arrive(); return; }
          over=0;
        }
        if(o.x < -160){ o.el.remove(); obs.splice(i,1); }
      }

      var last=obs.length?obs[obs.length-1]:null;
      var gapNeeded=Math.max(speed*1.05,235)+Math.random()*130;
      if(!last || (spawnAt-last.x)>gapNeeded){
        if(cleared+obs.length<TARGET) addObs();
      }
    }
    raf2=requestAnimationFrame(step);

    function tap(e){ if(e.target.closest&&e.target.closest(".btn")) return; jump(); }
    app.addEventListener("pointerdown",tap);

    function finish(){
      if(raf2) cancelAnimationFrame(raf2);
      app.removeEventListener("pointerdown",tap);
      road.remove();
      document.querySelector(".scene").style.display="";
      texEl.style.display="";
      smokerlab.textContent="FUMOIR";
      var bonus=fallen?0:150*S.level;
      S.score+=bonus; hud();
      panel.innerHTML='<h2>'+(fallen?"Smokey a mordu la poussière":"Arrivé au Daltons")+'</h2>'+
        '<p class="lead">'+cleared+' obstacle'+(cleared>1?"s":"")+' sur '+TARGET+' franchi'+(cleared>1?"s":"")+
        '. '+(fallen?"Il finit la route en boitant.":"Prime d\'arrivée : +"+bonus+" points.")+'</p>'+
        '<button class="btn" id="cgo">Ouvrir le smoker</button>';
      ov.classList.add("on");
      document.getElementById("cgo").onclick=allumage;
    }
  }
}

/* ---------- allumage des braises ---------- */
var COALS='<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">'+
'<ellipse cx="130" cy="98" rx="104" ry="18" fill="#140F0D"/>'+
'<g id="glow" opacity="0">'+
'<ellipse cx="130" cy="92" rx="98" ry="26" fill="#D64500" opacity=".35"/>'+
'<ellipse cx="130" cy="92" rx="66" ry="18" fill="#FF7A2F" opacity=".45"/>'+
'</g>'+
'<ellipse cx="66" cy="92" rx="20" ry="11" fill="#3A2A22"/>'+
'<ellipse cx="104" cy="97" rx="24" ry="12" fill="#463328"/>'+
'<ellipse cx="146" cy="93" rx="22" ry="12" fill="#3A2A22"/>'+
'<ellipse cx="188" cy="97" rx="20" ry="11" fill="#463328"/>'+
'<ellipse cx="126" cy="84" rx="18" ry="9" fill="#4E392C"/>'+
'<g id="embers" opacity="0">'+
'<ellipse cx="104" cy="97" rx="16" ry="7" fill="#FF6B1A"/>'+
'<ellipse cx="146" cy="93" rx="14" ry="7" fill="#FF8A3C"/>'+
'<ellipse cx="66" cy="92" rx="12" ry="6" fill="#E85A12"/>'+
'<ellipse cx="188" cy="97" rx="12" ry="6" fill="#FF6B1A"/>'+
'</g>'+
'<g id="flames" opacity="0">'+
'<path d="M104 88 C96 70 112 62 106 44 C124 56 128 76 118 90 Z" fill="#FF7A2F"/>'+
'<path d="M136 86 C128 66 146 58 140 38 C160 52 162 74 150 88 Z" fill="#FF9A3F"/>'+
'<path d="M120 88 C114 76 124 70 121 58 C133 68 134 80 128 89 Z" fill="#E8B54A"/>'+
'</g></svg>';

function allumage(){
  if(S.lives<=0) return;
  paused=true; screenName="fire";
  var dur=5, left=dur, heat=0, run=true, taps=0, t0=performance.now();
  var gain=Math.max(6,11-S.level*.5), decay=12+S.level*1.2;
  var ang=0, vel=0, puffT=null, lastBlow=0;
  panel.innerHTML='<h2>Allumez le smoker</h2>'+
    '<p class="lead">Tapez l\'écran le plus vite possible.</p>'+
    '<div class="blower" id="blower"><img src="'+LOGO+'" alt="Smokey">'+FACE+
    '<span class="breath" id="breath"></span></div>'+
    '<div class="coals">'+COALS+'</div>'+
    '<div class="heatbar"><i id="heat"></i></div>'+
    '<p class="tmr" id="ftmr">5</p>'+
    '<p class="gtip">TAPEZ N\'IMPORTE OÙ</p>';
  ov.classList.add("on");
  var bar=document.getElementById("heat"), ftmr=document.getElementById("ftmr"),
      gGlow=document.getElementById("glow"), gEmb=document.getElementById("embers"),
      gFla=document.getElementById("flames"), blower=document.getElementById("blower"),
      breath=document.getElementById("breath"),
      bpL=blower.querySelector(".pupL"), bpR=blower.querySelector(".pupR");

  function paint(){
    var h=heat/100;
    bar.style.width=(h*100)+"%";
    gGlow.setAttribute("opacity",(h*.9).toFixed(2));
    gEmb.setAttribute("opacity",Math.min(1,h*1.4).toFixed(2));
    gFla.setAttribute("opacity",Math.max(0,(h-.55)/.45).toFixed(2));
  }
  function anim(ts){
    if(!run) return;
    var dt=(ts-t0)/1000; t0=ts;
    heat=Math.max(0,heat-decay*dt);
    vel=Math.max(0,vel-5.5*dt);
    ang+=vel*dt;
    bpL.setAttribute("transform","translate("+(Math.cos(ang)*5.5).toFixed(2)+","+(Math.sin(ang)*5.5).toFixed(2)+")");
    bpR.setAttribute("transform","translate("+(Math.cos(ang+.7)*5).toFixed(2)+","+(Math.sin(ang+.7)*5).toFixed(2)+")");
    left-=dt; if(left<0) left=0;
    ftmr.textContent=Math.ceil(left);
    ftmr.className="tmr"+(left<2?" hot":"");
    paint();
    if(left<=0){ finish(); return; }
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);

  function blow(){
    if(!run) return;
    taps++;
    heat=Math.min(100,heat+gain);
    vel=Math.min(30,vel+4.4);
    blower.classList.add("puff");
    clearTimeout(puffT);
    puffT=setTimeout(function(){ blower.classList.remove("puff"); },110);
    paint();
    var now=performance.now();
    if(now-lastBlow>85){
      lastBlow=now;
      if(!playSnd("blow",.7,.9+Math.random()*.28)) beep(300+heat*5,.035,"sine",.03);
    }
    if(breath.childElementCount<16){
      for(var k=0;k<2;k++){
        var m=document.createElement("i");
        m.className="mist";
        m.style.setProperty("--dx",(Math.random()*34-17).toFixed(0)+"px");
        m.style.animationDelay=(k*60)+"ms";
        breath.appendChild(m);
        (function(node){ setTimeout(function(){ node.remove(); },760); })(m);
      }
    }
    if(heat>=100) finish();
  }
  function finish(){
    if(!run) return;
    run=false; ov.removeEventListener("pointerdown",blow);
    var bonus,title,txt;
    if(heat>=100){
      bonus=Math.round((60+40*left)*S.level); S.fires++;
      title="Feu d'enfer"; txt="+"+bonus+" points, allumé en "+(dur-left).toFixed(1)+" s.";
      voice("yeehaw");
    } else if(heat>=55){
      bonus=Math.round(heat/100*40*S.level);
      title="Ça fume"; txt="+"+bonus+" points. Le feu prend mollement.";
      beep(420,.2,"sine",.05);
    } else {
      bonus=Math.round(heat/100*40*S.level);
      title="Braises molles"; txt=(bonus?"+"+bonus+" points seulement.":"Aucun point.")+" Il faudra taper plus vite.";
      beep(140,.3,"sawtooth",.05);
    }
    S.score+=bonus; hud();
    panel.innerHTML='<h2>'+title+'</h2><p class="lead">'+txt+'</p>'+
      '<p class="boardnote">'+taps+' souffles</p>'+
      '<button class="btn" id="fgo">Ouvrir le service</button>';
    document.getElementById("fgo").onclick=resume;
  }
  ov.addEventListener("pointerdown",blow);
}

/* ---------- cuisson ---------- */
function cuisson(){
  if(S.lives<=0) return;
  paused=true;
  var w=Math.max(16,32-S.level*2.2), start=10+Math.random()*(78-w);
  var core=start+w*.33, coreW=w*.34;
  var speed=62+S.level*10, pos=0, dir=1, run=true, t0=performance.now(), left=4;
  panel.innerHTML='<h2>Cuisson parfaite</h2>'+
    '<p class="lead">Sortez la pièce du fumoir pile sur la braise. Quatre secondes, pas plus.</p>'+
    '<p class="tmr" id="tmr">4</p><div class="tmrbar"><i id="tmrb"></i></div>'+
    '<div class="gauge"><div class="z z1" style="left:'+start+'%;width:'+w+'%"></div>'+
    '<div class="z z2" style="left:'+core+'%;width:'+coreW+'%"></div><div class="cur" id="cur"></div></div>'+
    '<p class="gtip">TAPEZ N\'IMPORTE OÙ</p><button class="btn" id="cut">Sortir la viande</button>';
  ov.classList.add("on");
  var cur=document.getElementById("cur"), tmr=document.getElementById("tmr"), tmrb=document.getElementById("tmrb");
  function anim(ts){
    if(!run) return;
    var dt=(ts-t0)/1000; t0=ts;
    pos+=dir*speed*dt;
    if(pos>100){pos=100;dir=-1;} if(pos<0){pos=0;dir=1;}
    cur.style.left=pos+"%";
    left-=dt;
    if(left<0) left=0;
    tmr.textContent=Math.ceil(left);
    tmr.className="tmr"+(left<2?" hot":"");
    tmrb.style.width=(left/4*100)+"%";
    if(left<=0){ cut(true); return; }
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
  function cut(burnt){
    if(!run) return;
    run=false; ov.removeEventListener("pointerdown",tap);
    S.cooks++;
    var bonus,title,mult;
    if(burnt===true){ bonus=0; mult=1; title="Carbonisé"; beep(90,.45,"sawtooth",.07); }
    else if(pos>=core&&pos<=core+coreW){ bonus=150*S.level; mult=3; title="Bark parfait"; S.perfect++; beep(980,.25,"sine",.06); }
    else if(pos>=start&&pos<=start+w){ bonus=60*S.level; mult=2; title="Bien fumé"; beep(700,.2,"sine",.05); }
    else { bonus=0; mult=1; title="Trop cuit"; beep(130,.35,"sawtooth",.06); }
    S.score+=bonus; S.mult=mult; S.level++; S.smoke=0; S.smokeMax=100+S.level*18;
    hud();
    panel.innerHTML='<h2>'+title+'</h2><p class="lead">'+
      (bonus?"+"+bonus+" points, et manche suivante en ×"+mult+".":
       burnt===true?"Vous avez laissé la pièce au fumoir. On repart à ×1.":"Aucun bonus. On repart à ×1.")+
      '</p><button class="btn" id="back">Au labyrinthe</button>';
    document.getElementById("back").onclick=laby;
  }
  function tap(){ cut(false); }
  document.getElementById("cut").onclick=tap;
  ov.addEventListener("pointerdown",tap);
}

/* ---------- écrans ---------- */
function home(){
  paused=true; screenName="home";
  panel.innerHTML='<img class="logo" src="'+LOGO_FULL+'" alt="The Daltons Smokehouse">'+
    '<h1>Smokey</h1>'+
    '<div class="legend"><div>'+ART.ribs+'Viande<br>+ points</div>'+
    '<div>'+ART.tomahawk+'Tomahawk<br>rare</div>'+
    '<div>'+ART.tomate+'Légumes<br>− une vie</div></div>'+
    '<ol class="rules">'+
    '<li><b>1</b>Sur la route, tapez pour sauter les barrières et les mares d\'eau.</li>'+
    '<li><b>2</b>Au smoker, tapez le plus vite possible : Smokey souffle sur les braises.</li>'+
    '<li><b>3</b>Glissez la poignée en bas de l\'écran. Attrapez la viande, évitez les légumes.</li>'+
    '<li><b>4</b>Trois légumes attrapés et le service est fini.</li>'+
    '<li><b>5</b>Fumoir plein, sortez la pièce sur la braise en quatre secondes.</li>'+
    '<li><b>6</b>Puis guidez Smokey hors du labyrinthe en vingt secondes, au doigt.</li>'+
    '</ol>'+
    '<button class="btn" id="go">Allumer le fumoir</button>'+
    (standalone?"":'<p class="boardnote" style="margin-top:14px">Pour jouer sans la barre d\'adresse : menu du navigateur, puis « Ajouter à l\'écran d\'accueil ».</p>')+
    boardHTML();
  ov.classList.add("on");
  document.getElementById("go").onclick=start;
}
var standalone=(function(){
  try{
    return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||
           (window.matchMedia&&window.matchMedia("(display-mode: fullscreen)").matches)||
           window.navigator.standalone===true;
  }catch(e){ return false; }
})();
function goFullscreen(){
  if(standalone) return;
  try{
    var el=document.documentElement;
    if(document.fullscreenElement||document.webkitFullscreenElement) return;
    if(el.requestFullscreen){ var p=el.requestFullscreen(); if(p&&p.catch) p.catch(function(){}); }
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
function resume(){
  ov.classList.remove("on"); screenName="game";
  paused=false; lastT=performance.now();
}
function start(){
  reset(); screenName="game"; spin=0;
  goFullscreen();
  initAudio();
  S.texX=S.aimX=(stage.clientWidth||360)/2;
  Array.prototype.slice.call(stage.querySelectorAll(".item,.pop")).forEach(function(n){n.remove();});
  hud();
  if(raf) cancelAnimationFrame(raf);
  paused=true; lastT=performance.now();
  raf=requestAnimationFrame(loop);
  beep(520,.12,"sine",.05);
  course();
}
function gameOver(){
  paused=true; screenName="over";
  var q=qualifies(S.score);
  panel.innerHTML='<h2>Fumoir éteint</h2>'+
    '<div class="stats"><div class="stat"><b>'+S.score+'</b><span>POINTS</span></div>'+
    '<div class="stat"><b>'+S.caught+'</b><span>PIÈCES</span></div>'+
    '<div class="stat"><b>'+S.perfect+'</b><span>CUISSONS PARFAITES</span></div>'+
    '<div class="stat"><b>'+S.fires+'</b><span>FEUX D\'ENFER</span></div>'+
    '<div class="stat"><b>'+S.escapes+'</b><span>LABYRINTHES</span></div></div>'+
    (q?'<p class="lead" style="color:var(--laiton)">Vous entrez au classement. Votre nom ?</p>'+
       '<input class="nameinput" id="nm" maxlength="14" placeholder="Votre nom" value="'+esc(lastName)+'">'+
       '<p class="err" id="er" style="display:none">Entrez un nom pour enregistrer.</p>'+
       '<button class="btn" id="save">Enregistrer</button>':"")+
    '<div class="row" style="margin-top:18px"><button class="btn'+(q?" alt":"")+'" id="again">Rejouer</button>'+
    '<button class="btn alt" id="menu">Accueil</button></div>';
  ov.classList.add("on");
  if(q){
    var nm=document.getElementById("nm"), er=document.getElementById("er");
    nm.oninput=function(){ er.style.display="none"; };
    document.getElementById("save").onclick=function(){
      var v=nm.value.trim();
      if(!v){ er.style.display="block"; nm.focus(); return; }
      lastName=v; addScore(v,S.score); home();
    };
  }
  document.getElementById("again").onclick=start;
  document.getElementById("menu").onclick=home;
}
function togglePause(){
  if(!S||S.lives<=0||ov.classList.contains("on")) return;
  paused=true;
  panel.innerHTML='<h2>Pause</h2><p class="lead">La braise attend.</p>'+
    '<div class="row"><button class="btn" id="res">Reprendre</button>'+
    '<button class="btn alt" id="stop">Arrêter</button></div>';
  ov.classList.add("on");
  document.getElementById("res").onclick=function(){
    ov.classList.remove("on"); paused=false; lastT=performance.now();
  };
  document.getElementById("stop").onclick=gameOver;
}

/* ---------- contrôles ---------- */
var pad=document.getElementById("pad"), grip=document.getElementById("grip"),
    padhint=document.getElementById("padhint"), padW=0, dragging=false;
grip.innerHTML='<img src="'+LOGO+'" alt="">';
function measurePad(){ padW=pad.clientWidth; }
measurePad();
window.addEventListener("resize",measurePad);

function padAim(e){
  if(!S||paused) return;
  var r=pad.getBoundingClientRect();
  var px=(e.clientX!==undefined?e.clientX:e.touches[0].clientX)-r.left;
  var span=Math.max(r.width-60,1);
  var ratio=Math.max(0,Math.min(1,(px-30)/span));
  var w=stage.clientWidth;
  S.aimX=TEX_W/2+ratio*Math.max(w-TEX_W,0);
  if(padhint){ padhint.style.opacity=0; }
}
pad.addEventListener("pointerdown",function(e){
  dragging=true; grip.classList.add("hold");
  if(pad.setPointerCapture) try{ pad.setPointerCapture(e.pointerId); }catch(err){}
  padAim(e);
});
pad.addEventListener("pointermove",function(e){ if(dragging) padAim(e); });
function endDrag(){ dragging=false; grip.classList.remove("hold"); }
pad.addEventListener("pointerup",endDrag);
pad.addEventListener("pointercancel",endDrag);
pad.addEventListener("pointerleave",endDrag);

document.addEventListener("keydown",function(e){
  if(!S) return;
  var w=stage.clientWidth;
  if(e.key==="ArrowLeft") S.aimX=Math.max(TEX_W/2,S.aimX-46);
  if(e.key==="ArrowRight") S.aimX=Math.min(w-TEX_W/2,S.aimX+46);
  if(e.key==="Escape") togglePause();
});
document.getElementById("pause").onclick=togglePause;
document.getElementById("sound").onclick=function(){
  soundOn=!soundOn; this.textContent=soundOn?"🔊":"🔇"; this.style.opacity=soundOn?.55:.25;
};
document.addEventListener("visibilitychange",function(){ if(document.hidden) togglePause(); });

reset(); hud(); home(); loadScores();
raf=requestAnimationFrame(loop);
})();
</script>
